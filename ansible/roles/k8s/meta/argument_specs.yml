---
argument_specs:
  main:
    short_description: This roles is for all k8s cluster configuration install
    description: This roles is for all k8s cluster configuration install
    options:
      k8s_config_mode:
        type: str
        required: false
        default: add
        choices:
          - install
          - remove
        description: "k8s config mode"
      k8s_version:
        type: str
        required: false
        description: "Kubernetes package version, for example 1.32.0"
      k8s_minor:
        type: str
        required: false
        description: "Kubernetes repository minor version. Derived from k8s_version when omitted."
      k8s_package_version:
        type: str
        required: false
        default: ""
        description: "Optional exact apt version applied to kubeadm, kubelet, and kubectl."
      k8s_node_ip:
        type: str
        required: false
        description: "Node IP passed to kubelet."
