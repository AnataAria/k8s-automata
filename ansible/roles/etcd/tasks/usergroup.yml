---
- name: Create etcd system group
  ansible.builtin.group:
    name: "{{ etcd_system_group }}"
    system: true
    state: present

- name: Create etcd system user
  ansible.builtin.user:
    name: "{{ etcd_system_username }}"
    group: "{{ etcd_system_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ etcd_home_dir }}"
    create_home: false
    state: present

- name: Create etcd dir
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: '{{ etcd_data_dir }}', owner: 'etcd', group: 'etcd', mode: '0700' }
    - { path: '{{ etcd_cert_dir }}', owner: 'etcd', group: 'etcd', mode: '0700' }
    - { path: '{{ etcd_config_dir }}', owner: 'root', group: 'root', mode: '0755' }
